<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>SW-Web</title>

    <!--
      Las mismas etiquetas que index.html, y por un motivo concreto: GitHub Pages
      sirve ESTE archivo para cualquier enlace profundo (/SW-Web/seccion,
      /SW-Web/seccion/entrada...), que son justo los que se pegan en Discord. Sin
      ellas, esos enlaces no mostrarían tarjeta.

      Aviso: Pages responde con un 404 de verdad aquí, y algunos rastreadores no
      montan la vista previa de una respuesta 404. La forma robusta de arreglarlo
      es generar un HTML por ruta en el build; esto es lo que se puede hacer sin
      eso.
    -->

    <meta
      name="description"
      content="The lore archive of our RP setting."
    />

    <!--
      Tarjeta de vista previa (Open Graph): es lo que se ve al pegar un enlace del
      archivo en Discord, que es por donde se comparte casi todo. Sin esto solo
      salía la URL pelada.

      La dirección de la imagen va absoluta y escrita a mano a propósito: los
      rastreadores no resuelven rutas relativas, y %BASE_URL% cubre la ruta pero
      no el dominio. Si el sitio se muda, hay que cambiarla aquí Y en 404.html.

      Ojo con el alcance: el rastreador no ejecuta React, así que lee este mismo
      HTML para cualquier ruta. Todos los enlaces muestran esta tarjeta; una por
      página necesitaría generar un HTML por ruta en el build.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SW-Web" />
    <meta property="og:title" content="SW-Web" />
    <meta
      property="og:description"
      content="The lore archive of our RP setting."
    />
    <meta property="og:url" content="https://amaranthw21.github.io/SW-Web/" />
    <!--
      Falta la imagen de la tarjeta. Cuando exista public/og-image.jpg (1200×630),
      añadir aquí og:image (URL absoluta), og:image:width/height, og:image:alt y
      twitter:card = summary_large_image. Igual en index.html y 404.html.
    -->

    <!-- Discord tiñe con esto la franja lateral de la tarjeta. -->
    <meta name="theme-color" content="#c04bd8" />

    <!--
      GitHub Pages no reescribe rutas del lado del servidor, así que cualquier
      enlace profundo (p. ej. /SW-Web/seccion/entrada) cae aquí. Este script
      codifica la ruta en la query y redirige a index.html, que la restaura.
      pathSegmentsToKeep = 1 porque el sitio vive bajo /SW-Web/.
      Ver https://github.com/rafgraph/spa-github-pages
    -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + pathSegmentsToKeep)
            .join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
