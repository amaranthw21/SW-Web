# Formularios del panel de edición (/panel): qué colecciones hay, dónde vive
# cada archivo y qué campos se ven. El panel lee este archivo tal cual (ver
# src/panel/schema.js), así que un campo añadido aquí aparece en el formulario.
#
# Sigue el formato de Sveltia/Decap, que era el panel de antes: así sirve su
# documentación para los widgets (string, text, richtext, number, boolean,
# select, color, image, list, relation).

# Carpeta por defecto para las imágenes subidas (cada colección pone la suya más
# abajo). `media_folder` es dónde se guarda el archivo en el repo y
# `public_folder` lo que se escribe en el JSON.
media_folder: public
public_folder: /

collections:
  # ───────────────────────── Portada ─────────────────────────
  # Un solo archivo, no una colección: la portada es una y no se crean más. De
  # ahí `files` en vez de `folder`.
  - name: pages
    label: Pages
    files:
      - name: home
        label: Home page
        file: src/content/home.json
        format: json
        fields:
          - { name: greeting, label: Greeting, widget: string, hint: "The big line at the top of the front page." }
          - { name: intro, label: Intro, widget: richtext, required: false, hint: "What this archive is, for someone arriving for the first time. Leave a blank line between paragraphs." }
          - { name: image, label: "Header picture", widget: image, required: false, hint: "Sits behind the header, fading out towards the text. Without one the header is a plain panel." }
          - { name: discordLabel, label: "Button label", widget: string, required: false, hint: "e.g. 'Join the Discord'. Leave empty and no button is shown." }
          - { name: discordUrl, label: "Button link", widget: string, required: false, hint: "Where the button goes. Needs the full address, https:// included." }
          - name: startHere
            label: "Start here"
            widget: list
            required: false
            label_singular: Card
            summary: "{{fields.title}} → {{fields.route}}"
            hint: "The cards under the header: where a newcomer should go first. Three or four work best."
            fields:
              - { name: title, label: Title, widget: string }
              - { name: description, label: Description, widget: text, required: false }
              - { name: route, label: Link, widget: string, required: false, hint: "An address inside the site, e.g. /credits. Empty and the card isn't clickable." }
              - { name: image, label: Picture, widget: image, required: false, hint: "Comes in from the right of the card, fading towards the text." }
              - { name: imagePosition, label: "Image position (CSS object-position)", widget: string, required: false, hint: "e.g. 'center 20%'" }
          - { name: linksTitle, label: "Links heading", widget: string, required: false, hint: "The heading over the links. Empty uses 'Links'." }
          - name: links
            label: Links
            widget: list
            required: false
            label_singular: Link
            summary: "{{fields.label}} → {{fields.url}}"
            hint: "Everything that lives outside the archive: the Discord, art blogs, forms, other wikis. They come out as a row of buttons, in the order you put them."
            fields:
              - { name: label, label: Label, widget: string, hint: "What the button says, e.g. 'The Discord server'." }
              - { name: url, label: Address, widget: string, hint: "The full address, https:// included. An address inside the site (/credits) also works and won't open a new tab." }
              - { name: icon, label: Logo, widget: image, required: false, hint: "The site's logo. Square images look best; a transparent PNG best of all. Without one, the button shows the first letter." }
              - { name: description, label: Description, widget: string, required: false, hint: "Not printed — it shows when the mouse rests on the button, and screen readers read it. One line: what someone finds if they click." }

      - name: region
        label: Region page
        file: src/content/region.json
        format: json
        fields:
          - { name: region, label: "Region name", widget: string, hint: "The region's name, e.g. 'Bethath'. It titles its page and its entry in the sidebar." }
          - { name: intro, label: Intro, widget: richtext, required: false, hint: "A few lines about the region, above the island cards. Leave a blank line between paragraphs." }

      # El Rulebook de General: un apartado por tipo de reglas (General,
      # Character, Combat, Romance), cada uno con sus reglas numeradas.
      - name: rulebook
        label: Rulebook
        file: src/content/rulebook.json
        format: json
        fields:
          - name: sections
            label: Sections
            widget: list
            label_singular: Section
            summary: "{{fields.title}}"
            hint: "Each section is a heading on the page and an entry in its contents, in this order."
            fields:
              - { name: title, label: Title, widget: string, hint: "e.g. 'General' or 'Combat'." }
              - { name: intro, label: Intro, widget: richtext, required: false, hint: "Shown above the rules. Leave a blank line between paragraphs." }
              - name: rules
                label: Rules
                widget: list
                required: false
                label_singular: Rule
                summary: "{{fields.title}}"
                hint: "They're numbered on their own, in this order: don't write the [1] in the title."
                fields:
                  - { name: title, label: Title, widget: string }
                  - { name: text, label: Text, widget: richtext, required: false }
              - { name: outro, label: "Closing note", widget: richtext, required: false, hint: "Shown under the last rule, e.g. 'These rules may change in the future'." }

  # ───────────────────────── Islands ─────────────────────────
  # Las islas de la región, cada una en su carpeta con su JSON y sus imágenes
  # al lado (src/content/islands/<isla>/<isla>.json). Cada una sale como
  # tarjeta en la página de Bethath y en el submenú de la barra lateral, y tiene su
  # propia página.
  - name: islands
    label: Islands
    label_singular: Island
    folder: src/content/islands
    extension: json
    format: json
    create: true
    identifier_field: name
    # Una carpeta por isla: "Zero Island" se guarda en zero-island/zero-island.json.
    path: "{{slug}}/{{slug}}"
    summary: "{{fields.order}} · {{fields.name}}"
    sortable_fields: [order, name]
    # Las imágenes se suben a la carpeta de la propia isla y el JSON guarda solo
    # el nombre del archivo; src/data/islands.js lo convierte en su dirección.
    media_folder: ""
    public_folder: ""
    fields:
      - { name: name, label: Name, widget: string, hint: "e.g. 'Zero Island'." }
      - { name: order, label: Order, widget: number, value_type: int, hint: "Where it sits in the list: 1 goes first." }
      - { name: underConstruction, label: "Under construction", widget: boolean, default: false, required: false, hint: "The island shows up greyed out on the Bethath page and in the sidebar, but nobody can open it." }
      - { name: image, label: Picture, widget: image, required: false, hint: "Shown on the island's card and at the top of its page. It's saved in the island's own folder." }
      - { name: imagePosition, label: "Image position (CSS object-position)", widget: string, required: false, hint: "e.g. 'center 20%'" }
      - { name: background, label: "Page background", widget: image, required: false, hint: "Fills the whole page behind the island's story. Empty uses the Picture above." }
      - { name: color, label: "Accent color", widget: color, required: false, hint: "Tints the frame and the title on this island's own page. Empty keeps the site's gold." }
      - { name: summary, label: Summary, widget: text, required: false, hint: "One or two lines for the card on the Bethath page." }
      - { name: description, label: History, widget: richtext, required: false, hint: "The island's history, first thing on its page. Leave a blank line between paragraphs." }
      # Se eligen de la colección de Pokémon: se guarda su id ("lugia") y la web
      # saca de allí el nombre y la imagen, así que no hay que subirlas otra vez.
      - { name: legendaries, label: "Related legendaries", widget: relation, collection: pokemon, value_field: "{{slug}}", search_fields: [name, form], display_fields: ["{{name}} {{form}}"], multiple: true, required: false, hint: "The legendaries tied to this island. They show as small squares under its history. Search them by name." }
      - name: territories
        label: Territories
        widget: list
        required: false
        label_singular: Territory
        summary: "{{fields.name}}"
        hint: "Each island is split into two or three territories. Each one gets its own carousels of safe zones and dungeons."
        fields:
          - { name: name, label: Name, widget: string }
          - { name: description, label: Description, widget: richtext, required: false }
          - name: safeZones
            label: "Safe zones"
            widget: list
            required: false
            label_singular: "Safe zone"
            summary: "{{fields.name}}"
            fields:
              - { name: name, label: Name, widget: string }
              - { name: image, label: Picture, widget: image, required: false, hint: "Shown in the carousel. Saved in the island's own folder." }
              - { name: description, label: Description, widget: richtext, required: false, hint: "Opens under the carousel when someone clicks the place. Empty and the place can't be clicked." }
          - name: dungeons
            label: Dungeons
            widget: list
            required: false
            label_singular: Dungeon
            summary: "{{fields.name}}"
            fields:
              - { name: name, label: Name, widget: string }
              - { name: image, label: Picture, widget: image, required: false, hint: "Shown in the carousel. Saved in the island's own folder." }
              - { name: description, label: Description, widget: richtext, required: false, hint: "Opens under the carousel when someone clicks the place. Empty and the place can't be clicked." }
  # ───────────────────────── Characters ─────────────────────────
  # Una ficha por personaje, NPC o de jugador, en su carpeta con su JSON y sus
  # imágenes (src/content/characters/<id>/<id>.json), como las islas. Cada uno
  # elige su isla (y las que guarda, si guarda alguna), y cada isla lo enseña
  # sola en su carrusel de NPCs o de personajes, enlazado a su ficha
  # (/characters/<id>).
  - name: characters
    label: Characters
    label_singular: Character
    folder: src/content/characters
    extension: json
    format: json
    create: true
    identifier_field: name
    path: "{{slug}}/{{slug}}"
    summary: "{{fields.name}}"
    sortable_fields: [name]
    media_folder: ""
    public_folder: ""
    fields:
      # Basics
      - { name: name, label: Name, widget: string }
      - { name: nameOrigin, label: "Name origin", widget: string, required: false, hint: "Where the name comes from, e.g. 'From the Ampelomyces Quisqualis fungus'. Shown small next to the name." }
      - { name: kind, label: Kind, widget: select, default: npc, options: [{ label: NPC, value: npc }, { label: "Player character", value: player }], hint: "NPCs go in the island's NPC carousel; player characters in its Characters carousel." }
      - { name: status, label: Status, widget: select, required: false, default: available, options: [{ label: Available, value: available }, { label: Reserved, value: reserved }, { label: "In use", value: taken }], hint: "Only for player characters: whether someone has asked for it or plays it." }
      - { name: player, label: "Played by", widget: string, required: false, hint: "Only for player characters that are Reserved or In use." }
      - { name: island, label: Island, widget: relation, collection: islands, value_field: "{{slug}}", search_fields: [name], display_fields: ["{{name}}"], required: false, hint: "The island the character lives on. It shows up on that island's page." }
      - { name: guardianOf, label: "Guardian of", widget: relation, collection: islands, value_field: "{{slug}}", search_fields: [name], display_fields: ["{{name}}"], multiple: true, required: false, hint: "The islands it guards, if any; most characters guard none, a few guard several. It shows up first on each of them." }
      - { name: image, label: Portrait, widget: image, required: false, hint: "Shown in the infobox and on the cards. Saved in the character's own folder." }
      - { name: imageCredit, label: "Portrait credit", widget: string, required: false, hint: "e.g. 'Drawn by Xanandra'. Shown under the portrait." }
      # El zoom (cardZoom) lo lleva el propio widget de encuadre, con su barra.
      - { name: cardPosition, label: "Framing", widget: focus, image_field: image, zoom_field: cardZoom, required: false, hint: "How the portrait sits in the Characters page circle and the island carousel. Drag it in either preview (or use the arrow keys), and zoom in to fill the space." }
      - { name: summary, label: Summary, widget: text, required: false, hint: "One or two lines for the cards and the island carousel." }
      - { name: gender, label: Gender, widget: string, required: false }
      - { name: age, label: Age, widget: string, required: false, hint: "Text, so '35', 'Unknown' or 'Ancient' all work." }
      - { name: fusionName, label: "Fusion name", widget: string, required: false, hint: "e.g. 'Mausozma'. Leave empty if it isn't a fusion." }
      - { name: species1, label: "Species 1", widget: relation, collection: pokemon, value_field: "{{slug}}", search_fields: [name, form], display_fields: ["{{name}} {{form}}"], required: false, hint: "Search it by name. Its picture and name come from the Pokémon list." }
      - { name: species2, label: "Species 2", widget: relation, collection: pokemon, value_field: "{{slug}}", search_fields: [name, form], display_fields: ["{{name}} {{form}}"], required: false, hint: "The second species of a fusion." }
      - { name: type1, label: "Main type 1", widget: select, required: false, options: [Normal, Fire, Water, Electric, Grass, Ice, Fighting, Poison, Ground, Flying, Psychic, Bug, Rock, Ghost, Dragon, Dark, Steel, Fairy, Stellar, Shadow, Radiant] }
      - { name: type2, label: "Main type 2", widget: select, required: false, options: [Normal, Fire, Water, Electric, Grass, Ice, Fighting, Poison, Ground, Flying, Psychic, Bug, Rock, Ghost, Dragon, Dark, Steel, Fairy, Stellar, Shadow, Radiant] }
      - { name: type3, label: "Main type 3", widget: select, required: false, hint: "Only for Amalgams, which have three types of their own.", options: [Normal, Fire, Water, Electric, Grass, Ice, Fighting, Poison, Ground, Flying, Psychic, Bug, Rock, Ghost, Dragon, Dark, Steel, Fairy, Stellar, Shadow, Radiant] }
      - { name: hiddenType, label: "Hidden type", widget: select, required: false, hint: "Leave empty for Amalgams: they have no hidden type.", options: [Normal, Fire, Water, Electric, Grass, Ice, Fighting, Poison, Ground, Flying, Psychic, Bug, Rock, Ghost, Dragon, Dark, Steel, Fairy, Stellar, Shadow, Radiant] }
      # Personality
      - name: traits
        label: "Personality traits"
        label_singular: Trait
        widget: list
        required: false
        field: { name: trait, label: Trait, widget: string }
        hint: "One per row, e.g. 'Curious'. They show as tags."
      - name: likes
        label: Likes
        label_singular: Like
        widget: list
        required: false
        field: { name: like, label: Like, widget: string }
        hint: "One per row. Short ('Sunny days') or 'Title: explanation' ('Company: likes being around friends…'). With a title it shows as a card with the title highlighted."
      - name: dislikes
        label: Dislikes
        label_singular: Dislike
        widget: list
        required: false
        field: { name: dislike, label: Dislike, widget: string }
        hint: "One per row. Short ('Sunny days') or 'Title: explanation' ('Company: likes being around friends…'). With a title it shows as a card with the title highlighted."
      - name: fears
        label: "Fears / phobias"
        label_singular: Fear
        widget: list
        required: false
        field: { name: fear, label: Fear, widget: string }
        hint: "One per row. Short ('Sunny days') or 'Title: explanation' ('Company: likes being around friends…'). With a title it shows as a card with the title highlighted."
      - { name: personality, label: "In-depth personality", widget: richtext, required: false, hint: "For a character made of several identities, the part they share; each identity's own part goes below." }
      - name: identities
        label: Identities
        label_singular: Identity
        widget: list
        required: false
        summary: "{{fields.name}}"
        hint: "Only for a character that is several in one body (e.g. Malaya and Bailey). In Likes, Dislikes and Fears, end an entry's title with who it belongs to: 'Cooking (Malaya): …', 'Forced inactivity (Both): …'."
        fields:
          - { name: name, label: Name, widget: string }
          - { name: color, label: Color, widget: color, required: false, hint: "Tints its name and its entries. Empty picks one." }
          - { name: personality, label: Personality, widget: richtext, required: false, hint: "Shown in its own card under the shared personality." }
      # Abilities and moves
      - name: abilities
        label: Abilities
        label_singular: Ability
        widget: list
        required: false
        summary: "{{fields.slot}}: {{fields.name}}"
        fields:
          - { name: slot, label: Slot, widget: string, hint: "e.g. 'Common Talent' or 'Common Battle'." }
          - { name: name, label: Name, widget: string, hint: "e.g. 'Friend Guard'." }
          - { name: description, label: Description, widget: richtext, required: false, hint: "Put numbers in backticks to highlight them: `[-25%]`." }
      - name: moves
        label: Moves
        label_singular: Move
        widget: list
        required: false
        summary: "{{fields.name}} ({{fields.category}}-{{fields.type}}/{{fields.pp}})"
        fields:
          - { name: name, label: Name, widget: string }
          - { name: category, label: Category, widget: select, options: [Physical, Special, Status] }
          - { name: type, label: Type, widget: select, options: [Normal, Fire, Water, Electric, Grass, Ice, Fighting, Poison, Ground, Flying, Psychic, Bug, Rock, Ghost, Dragon, Dark, Steel, Fairy, Stellar, Shadow, Radiant] }
          - { name: pp, label: PP, widget: number, value_type: int, required: false, min: 1 }
          - { name: legendary, label: Legendary, widget: boolean, default: false, required: false, hint: "Shown as a 'Legendary' tag next to the move." }
          - { name: custom, label: Custom, widget: boolean, default: false, required: false, hint: "A move made up for this character. Shown as a 'Custom' tag." }
          - { name: description, label: Description, widget: richtext, required: false, hint: "Put numbers in backticks to highlight them: `[1.5x]`." }
      # Story and appearance
      - { name: backstory, label: Backstory, widget: richtext, required: false, hint: "Line breaks are kept, so verses read as verses. Leave a blank line between paragraphs." }
      - name: gallery
        label: Appearance
        label_singular: Picture
        widget: list
        required: false
        summary: "{{fields.credit}}"
        hint: "Pictures of the character, each with its credit. Saved in the character's own folder."
        fields:
          - { name: image, label: Picture, widget: image }
          - { name: credit, label: Credit, widget: string, required: false, hint: "e.g. 'Drawn by Xanandra, coloring by ???'." }


  # ───────────────────────── Pokémon ─────────────────────────
  # Uno por archivo, importados del Excel (scripts/import-excel.py). Las
  # opciones de los desplegables son las de la pestaña VALUES y tienen que
  # coincidir con las de src/data/pokemon.js: un valor que no esté allí se
  # enseña tal cual en la tabla, pero no aparece en los filtros.
  - name: pokemon
    label: Pokémon
    label_singular: Pokémon
    folder: src/content/pokemon
    extension: json
    format: json
    create: true
    identifier_field: name
    summary: "{{fields.order}} · {{fields.name}} {{fields.form}} — {{fields.status}}"
    sortable_fields: [order, name, status, generation]
    media_folder: /public/pokemon
    public_folder: /pokemon
    fields:
      - { name: order, label: "Number (#)", widget: number, value_type: int, hint: "The number from the Excel. Forms take the number right after their base Pokémon, so they sit together (Corsola 15, Galarian Corsola 16). Fakemon use negative numbers: -1, -2…" }
      - { name: name, label: Name, widget: string, hint: "Without the form, e.g. 'Corsola'." }
      - { name: form, label: Form, widget: string, required: false, hint: "e.g. 'Galarian', 'Female', 'Heat'. Leave empty for the base form." }
      - { name: image, label: Image, widget: image, required: false, hint: "Square, with a transparent background. Shown small in the table." }
      - { name: status, label: Status, widget: select, default: OPEN, options: ["OPEN", "PENDING", "RESERVED (1ST)", "RESERVED (>1)", "CLOSED"] }
      - { name: claimed, label: Claimed, widget: boolean, default: false, hint: "Someone has this Pokémon." }
      - { name: npc, label: "NPC", widget: boolean, default: false, hint: "It belongs to an NPC. Shown as 'NPC' next to the owner." }
      - { name: owner, label: Owner, widget: string, required: false, hint: "The player's user name (for an NPC, who plays it). Shown on the site. Empty shows just 'Claimed'." }
      - { name: fusedWith, label: "Fused with", widget: string, required: false }
      - { name: generation, label: Generation, widget: number, value_type: int, required: false, min: 1, max: 9, hint: "1 to 9. Empty for Fakemon." }
      - { name: type1, label: "Type 1", widget: select, options: [Normal, Fire, Water, Electric, Grass, Ice, Fighting, Poison, Ground, Flying, Psychic, Bug, Rock, Ghost, Dragon, Dark, Steel, Fairy, Stellar, Shadow, Radiant] }
      - { name: type2, label: "Type 2", widget: select, required: false, options: [Normal, Fire, Water, Electric, Grass, Ice, Fighting, Poison, Ground, Flying, Psychic, Bug, Rock, Ghost, Dragon, Dark, Steel, Fairy, Stellar, Shadow, Radiant] }
      - { name: lineStatus, label: "Line status", widget: select, options: ["OPEN", "LINE RESERVED", "CAN'T EVOLVE", "FINAL EVOLUTION", "DOESN'T EVOLVE"] }
      - { name: stage, label: "Evolutive stage", widget: select, options: ["NO EVOLUTION", "1|2", "2|2", "1|3", "2|3", "3|3", "1|2 // 1|3"], hint: "Stage of the line: '1|3' is the first of three." }
      - { name: classification, label: Classification, widget: select, required: false, options: ["NORMAL", "MAN-MADE", "PARADOX", "MAJOR LEGENDARY", "MINOR LEGENDARY", "MAN-MADE LEGENDARY", "ULTRABEAST"] }
      - { name: fakemon, label: Fakemon, widget: boolean, default: false }
      - { name: creator, label: "Creator (Fakemon)", widget: string, required: false, hint: "Only for Fakemon: who designed it. Shown on the site." }

  # ───────────────────────── Items ─────────────────────────
  - name: items
    label: Items
    label_singular: Item
    folder: src/content/items
    extension: json
    format: json
    create: true
    identifier_field: name
    summary: "{{fields.name}} {{fields.note}} — {{fields.type}} · {{fields.rarity}}"
    sortable_fields: [name, type, rarity]
    media_folder: /public/items
    public_folder: /items
    fields:
      - { name: name, label: Name, widget: string }
      - { name: note, label: Note, widget: string, required: false, hint: "Shown small under the name, e.g. the Pokémon a belonging is for ('Zapdos')." }
      - { name: image, label: Image, widget: image, required: false, hint: "Square, with a transparent background." }
      - { name: type, label: Type, widget: select, options: ["ITEM", "CONSUMABLE/HELD", "BERRY", "MEAL"], hint: "Special belongings and blessings have their own collections." }
      - { name: rarity, label: Rarity, widget: select, options: ["Common", "Uncommon", "Rare", "Super Rare", "Special"] }
      - { name: description, label: Description, widget: text, required: false }
      - { name: buy, label: "Buy price", widget: number, value_type: int, required: false, hint: "Empty if it can't be bought." }
      - { name: sell, label: "Sell price", widget: number, value_type: int, required: false, hint: "Empty if it can't be sold." }
      - { name: howToGet, label: "How to get", widget: select, options: ["FIND", "CRAFT", "SPECIAL"] }
      - name: locations
        label: "Locations / instructions"
        label_singular: Location
        widget: list
        required: false
        field: { name: location, label: Location, widget: string }
        hint: "Where it's found (e.g. 'CERULEAN CAPE'), or what to do ('ASK THE CC'). Each one becomes an option in the Location filter."
      - name: ingredients
        label: Ingredients
        label_singular: Ingredient
        widget: list
        required: false
        summary: "{{fields.quantity}} × {{fields.item}}"
        hint: "Only for crafted items."
        fields:
          - { name: item, label: Ingredient, widget: string, hint: "e.g. 'IRON BALL' or 'ANY HEALING BERRY'." }
          - { name: quantity, label: Quantity, widget: number, value_type: int, default: 1, min: 1 }

  # ───────────────────────── Special belongings ─────────────────────────
  # Venían en la hoja de objetos (tipo SPECIAL BELONGING); tienen página propia
  # porque no se compran ni se venden y casi todas van ligadas a un Pokémon.
  - name: belongings
    label: Special belongings
    label_singular: Special belonging
    folder: src/content/belongings
    extension: json
    format: json
    create: true
    identifier_field: name
    summary: "{{fields.name}} — {{fields.pokemon}}"
    sortable_fields: [name, pokemon, rarity]
    media_folder: /public/belongings
    public_folder: /belongings
    fields:
      - { name: name, label: Name, widget: string, hint: "The object, e.g. 'Energy Cell'. While it isn't written yet, the Pokémon's name." }
      - { name: pokemon, label: Pokémon, widget: string, required: false, hint: "Who it belongs to, e.g. 'Zapdos'." }
      - { name: image, label: Image, widget: image, required: false, hint: "Square, with a transparent background." }
      - { name: rarity, label: Rarity, widget: select, default: Special, options: ["Common", "Uncommon", "Rare", "Super Rare", "Special"] }
      - { name: description, label: Description, widget: text, required: false, hint: "Leave 'TO BE DEVELOPED' (or empty) while it isn't written: the page shows it as pending." }
      - name: locations
        label: "Locations / instructions"
        label_singular: Location
        widget: list
        required: false
        field: { name: location, label: Location, widget: string }

